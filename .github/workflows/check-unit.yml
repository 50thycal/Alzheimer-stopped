# Judges a unit pull request. pull_request_target runs this workflow as it is on main, with a token that can
# comment. The fork is NEVER checked out and nothing from it runs: tools/ci-pr.mjs reads the bytes of the one
# unit file through the API and parses them as JSON.
name: check-unit

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['units/**']

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: check-unit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the unit file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_ADMIN_TOKEN: ${{ secrets.HUB_ADMIN_TOKEN }}
          HUB: ${{ vars.HUB_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci-pr.mjs check
